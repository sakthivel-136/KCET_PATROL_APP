name: Build and Push Shorebird APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Push Shorebird Update (Patch or Release)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # Try to push an Over-The-Air patch to the active release (0.1.0+1)
          # Pass --release-version=0.1.0+1 so shorebird patch knows which release to target
          echo "Attempting to patch release 0.1.0+1..."
          if shorebird patch android --release-version=0.1.0+1 --allow-asset-diffs; then
            echo "Successfully pushed OTA patch to users!"
            echo "DID_PATCH=true" >> $GITHUB_ENV
          else
            echo "Patch attempt failed. Checking if a new release is needed..."
            # Bump pubspec patch/build version automatically if release needed
            sed -i 's/^version: .*/version: 0.1.1+2/' pubspec.yaml
            shorebird release android --artifact apk
            echo "DID_PATCH=false" >> $GITHUB_ENV
          fi

      - name: Commit and Push New Base APK
        if: env.DID_PATCH == 'false'
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/KCET_PATROL_APP.apk
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add apk/KCET_PATROL_APP.apk
          git commit -m "chore: auto-build new base APK for Shorebird" || echo "No changes to commit"
          git push origin main

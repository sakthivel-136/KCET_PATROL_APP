name: Build and Push Shorebird APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Push Shorebird Update (Patch or Release)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # Try to push an Over-The-Air patch first
          # We use --artifact apk in release to generate an apk instead of default aab
          if shorebird patch android; then
            echo "Successfully pushed OTA patch to users!"
            echo "DID_PATCH=true" >> $GITHUB_ENV
          else
            echo "Patch failed (likely first run or new version). Creating a new base release..."
            shorebird release android --artifact apk
            echo "DID_PATCH=false" >> $GITHUB_ENV
          fi

      - name: Commit and Push New Base APK
        if: env.DID_PATCH == 'false'
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/KCET_PATROL_APP.apk
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add apk/KCET_PATROL_APP.apk
          git commit -m "chore: auto-build new base APK for Shorebird" || echo "No changes to commit"
          git push origin main

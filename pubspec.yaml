name: veripatrol
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  mobile_scanner: ^3.2.0
  intl: ^0.18.1
  mailer: ^6.0.1
  geolocator: ^13.0.1
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  sqflite: ^2.2.8+4
  path: ^1.8.3
  connectivity_plus: ^6.0.0
  audioplayers: ^6.1.0
  vibration: ^2.0.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  # --- ADDED FOR CLOUD LOGIN & DATABASE ---
  supabase_flutter: ^2.8.0 
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/alert.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff" # Background color for Android
  adaptive_icon_foreground: "assets/logo.png"